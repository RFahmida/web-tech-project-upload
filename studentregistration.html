<!DOCTYPE html>
<html>
    <head>
        <h3>Registration form</h3>
    </head>
<body>

<form>
 <fieldset>
  <label for="name">Full name:</label>
  <input type="text" id="name" name="name"><br><br>
  <label for="phonenumber">Phone number:</label>
  <input type="text" id="phonenumber" name="phonenumber"><br><br>
  <label for="email">Email Address:</label>
  <textarea id="email" name="email" rows="1" cols="50" required></textarea><br><br>
  <label for="address">Home Address:</label>
  <textarea id="address" name="email" rows="1" cols="50" required></textarea><br><br>
  <label for="bloodtype">Blood Type:</label>
  <input type="email" id="bloodtype" name="bloodtype">
  <label for="dob">DOB:</label>
  <input type="date" id="dob" name="dob"><br><br>
  <label for="gender">Gender:</label><br>
  <input type="radio" id="gender" name="gender" value="Male">
  <label for="male">Male:</label>
  <input type="radio" id="female" name="gender" value="Female">
  <label for="female">Female:</label>
  <input type="radio" id="other" name="gender" value="Other">
  <label for="other">Other:</label><br><br>
  <label for="clubs">Choose a club:</label>
  <select id="clubs">
   <option value="artsnddesignclub">Art and Design Club</option>
   <option value="culturalclub">Cultural Club</option>
   <option value="photographyclub">Photography Club</option>
   <option value="dramaclub">Drama Club</option>
   <option value="filmandmediaclub">Film and Media Club</option>
   <option value="socialwelfareclub">Social Welfare Club</option>
   <option value="environmentclub">Environment Club</option>
   <option value="computerscienceclub">Computer Science Club</option>
   <option value="roboticsclub">Robotics Club</option>
   <option value="artificialintelligenceclub">Artificial Intelligence Club</option>
   <option value="researchclub">Research Club</option>
   <option value="mathematicsclub">Mathematics Club</option>
   <option value="cricketclub">Cricket Club</option>
   <option value="footballclub">Football Club</option>
   <option value="badmintonclub">Badminton Club</option>
   <option value="basketballclub">Basketball Club</option>
   <option value="chessclub">Chess Club</option>
  </select><br><br>
  <label for="passward">Passward:</label>
  <input type="text" id="passward" name="passward"><br><br>
  <label for="confirmedpassward">Confirmed Passward:</label>
  <input type="text" id="confirmedpassward" name="confirmedpassward"><br><br>
  <input type="submit" value="Submit">
 </fieldset>
</form>

</body>
</html>
